[package]
name = "fand"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
ctrlc = { version = "3.5.2", features = ["termination"] }
nvml-wrapper-sys = "0.10.0"
tokio = { version = "1.53.1", features = [
  "rt-multi-thread",
  "time",
  "sync",
  "macros",
] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
