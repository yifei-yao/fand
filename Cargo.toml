[package]
name = "fand"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.3"
ctrlc = { version = "3.5.2", features = ["termination"] }
nvml-wrapper-sys = "0.9.1"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "time", "sync"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
